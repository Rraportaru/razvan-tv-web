<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Razvan TV — Preview</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; background: #07101f; color: #f4f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 50% -25%, #17619a70, transparent 58%), linear-gradient(180deg,#07101fe8 0%,#091426c9 50%,#070d19f2 100%), url("./background-smoke.svg") center / cover fixed no-repeat; }
    button, input { font: inherit; }
    .ui-icon { width: 18px; height: 18px; flex: 0 0 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .app { min-height: 100vh; max-width: 1720px; margin: auto; padding: 34px clamp(22px,5vw,84px) 30px; display: flex; flex-direction: column; gap: 20px; }
    header { display: flex; align-items: center; gap: 15px; min-height: 64px; }
    header img { width: 54px; height: 54px; filter: drop-shadow(0 0 18px #42bfff77); }
    .brand-copy { display:flex; flex-direction:column; gap:2px; }
    .eyebrow { color:#8ab8d9; font-size:11px; font-weight:800; letter-spacing:.24em; text-transform:uppercase; }
    h1 { margin: 0; font-size: clamp(23px, 2.6vw, 34px); letter-spacing: .16em; line-height:1.08; }
    #count { color: #c9f3ff; font-size:12px; font-weight:800; letter-spacing:.12em; white-space: nowrap; border:1px solid #67cfff55; background:#1979a82b; border-radius:999px; padding:9px 13px; margin-left:7px; }
    .header-spacer { flex:1; }
    button { min-height: 48px; color: white; background: linear-gradient(145deg, #183c5ecf, #101d31e8); border: 1px solid #a9dfff45; border-radius: 14px; padding: 11px 16px; font-weight: 750; letter-spacing:.035em; cursor: pointer; box-shadow: inset 0 1px #ffffff1c, 0 10px 28px #0004; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease,background .18s ease; }
    button:hover { transform:translateY(-2px); border-color:#7adfffaa; box-shadow:inset 0 1px #ffffff2b,0 12px 30px #0005,0 0 20px #2eabed26; }
    button:focus, input:focus, .station:focus { outline: none; border-color: #7de5ff; background: linear-gradient(145deg, #17628ddd, #11314fe8); box-shadow: inset 0 1px #ffffff45, 0 0 0 2px #56ccff35, 0 0 24px #64d9ff88; }
    nav { display: flex; gap: 9px; overflow-x: auto; padding: 3px 2px 9px; scrollbar-width:thin; scrollbar-color:#347ba0 transparent; }
    nav button { white-space: nowrap; min-height:46px; border-radius:13px; background:#0c1a2bd1; }
    nav button.active { color: white; border-color: #72dcffdd; background: linear-gradient(145deg, #147cafc9, #123755f0); box-shadow:0 0 22px #25b9f52b,inset 0 1px #ffffff35; }
    .section-heading { display:flex; align-items:end; justify-content:space-between; gap:20px; margin:2px 1px -4px; }
    .section-heading h2 { margin:0; font-size:clamp(19px,2vw,25px); letter-spacing:.015em; }
    .section-heading p { margin:5px 0 0; color:#9fb5ca; font-size:13px; }
    .live-badge { color:#b8f6ff; font-size:10px; font-weight:900; letter-spacing:.16em; display:flex; align-items:center; gap:8px; text-transform:uppercase; }
    .live-badge:before { content:""; width:7px; height:7px; border-radius:50%; background:#4fffc4; box-shadow:0 0 12px #4fffc4; }
    #grid { display: grid; flex: 1; align-content: start; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 15px; }
    .station { min-height: 158px; padding: 12px 14px 13px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; background:linear-gradient(145deg,#17334bc9,#0b1526ed); border: 1px solid #9edaff30; border-radius: 18px; box-shadow: inset 0 1px #ffffff1b, 0 14px 30px #0004; overflow:hidden; }
    .station:before { content:""; position:absolute; inset:0; border-radius:inherit; background:radial-gradient(ellipse at 50% 0%,#51cfff16,transparent 70%); pointer-events:none; }
    .station:hover { transform:translateY(-3px); border-color:#70d9ff88; }
    .station img { display: block; width: 52%; height: 58px; object-fit: contain; flex: 0 0 auto; margin: auto; filter:drop-shadow(0 5px 12px #0007); }
    .station .station-title { width: 100%; margin-top: 7px; color: #f4f8ff; font-size: 14px; font-weight: 750; line-height: 1.25; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .station .favorite-mark { position: absolute; top: 9px; right: 11px; color: #ffe28a; font-size: 16px; filter:drop-shadow(0 0 6px #ffc94088); }
    .station { position: relative; }
    .empty { color: #bac6d4; text-align: center; padding: 60px 10px; }
    footer { display: flex; gap: 9px; color: #9aadc1; font-size: 12px; flex-wrap: wrap; padding-top:5px; }
    footer span { border: 1px solid #92c9ec27; background:#0a1524a8; border-radius: 8px; padding: 7px 10px; }
    #player { position: fixed; inset: 0; display: none; z-index: 3; background: #080a0e; }
    #player.open { display: flex; flex-direction: column; }
    #playerbar { height: 40px; flex: 0 0 40px; display: flex; padding: 0 12px; background: linear-gradient(155deg, #171d29ee, #0d111aef); border-bottom: 1px solid #cde8ff30; box-shadow: 0 6px 22px #0005; }
    #player-actions { width: 100%; height: 40px; display: flex; align-items: center; gap: 8px; }
    #player-actions button { width: 104px; min-height: 36px; height: 36px; padding: 0 8px; border-radius: 14px; }
    #player-left { min-width: 0; display: flex; align-items: center; gap: 6px; }
    #back { width: 40px!important; min-height: 36px!important; flex: 0 0 40px; padding: 0!important; font-size: 22px; line-height: 1; overflow: hidden; }
    #player-identity-group { min-width: 0; display: flex; align-items: center; gap: 6px; }
    #playerbar .app-icon { width: 24px; height: 24px; }
    #player-brand { min-width: 0; max-width: 105px; display: flex; flex-direction: column; }
    #player-brand strong { color: #64d9ff; font-size: 8px; line-height: 10px; letter-spacing: .08em; }
    #playing { font-size: 12px; line-height: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #open-page { width:38px!important; min-width:38px; padding:0; margin-left:auto; color:#c9efff; font-size:18px; }
    #player-favorite { flex: 0 0 104px; }
    #player-content { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #080a0e; }
    #player-content::after { content: ""; position: absolute; z-index: 1; inset: min(700px, calc(56.25vw + 27px)) 0 0; background: #080a0e; pointer-events: none; }
    #frame { position: absolute; top: -145px; left: 0; width: 100%; height: calc(100% + 200px); border: 0; background: black; transform: scale(.95); transform-origin: top center; }
    @media (max-width: 700px) {
      .app { padding: 18px 16px 22px; gap:16px; }
      header { flex-wrap: wrap; gap:10px; }
      header img {width:46px;height:46px}
      .header-spacer {display:none}
      #count {margin-left:auto}
      #grid { grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap:11px; }
      .station { min-height: 135px; }
      .station img { height: 46px; }
      .section-heading p {font-size:12px}
      #playerbar {padding:0 8px}
      #player-actions {gap:5px}
      #player-brand {max-width:76px}
      #playerbar .app-icon {width:21px;height:21px}
      #player-favorite {flex-basis:94px;width:94px!important}
    }
    @media (min-width: 1200px) {
      #player-content::before { content: ""; position: absolute; z-index: 2; inset: 0 auto 0 0; width: 11.5vw; background: #080a0e; pointer-events: none; }
      #player-content::after { inset: min(880px, 50vw) 0 0; }
      #frame { top: -22vh; left: -10.5vw; height: calc(100% + 250px); transform: scale(1.3); }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <img src="./icon.svg" alt="">
      <div class="brand-copy"><span class="eyebrow">Your screen. Your channels.</span><h1>RAZVAN TV</h1></div>
      <span id="count"></span><span class="header-spacer"></span>
      <button id="favorite-filter"></button>
      <button id="save-selected"></button>
    </header>
    <nav id="categories" aria-label="Categorii"></nav>
    <div class="section-heading"><div><h2>Explorează canalele</h2><p>Alege ceva bun de urmărit chiar acum.</p></div><span class="live-badge">LIVE DIRECTORY</span></div>
    <section id="grid" aria-label="Canale TV"></section>
    <footer><span>↑ ↓ ← → Navighează</span><span>ENTER Deschide canalul</span><span>F Favorite</span><span>ESC Înapoi</span></footer>
  </main>
  <section id="player" aria-label="Player">
    <div id="playerbar">
      <div id="player-actions"><div id="player-left"><button id="back" aria-label="Înapoi la canale">←</button><div id="player-identity-group"><img class="app-icon" src="./icon.svg" alt=""><span id="player-brand"><strong>RAZVAN TV</strong><span id="playing"></span></span></div></div><button id="open-page" title="Deschide canalul în browser" aria-label="Deschide canalul în browser">↗</button><button id="player-favorite"></button></div>
    </div>
    <div id="player-content"><iframe id="frame" allow="autoplay; fullscreen; picture-in-picture" referrerpolicy="no-referrer"></iframe></div>
  </section>
  <script>
    const categories = ['Toate', 'Generale', 'Filme', 'Știri', 'Sport', 'Copii', 'Tematice', 'Muzică'];
    const categoryPaths = {
      Toate: '<circle cx="9" cy="9" r="6.5"/><path d="M2.7 9h12.6M9 2.5c2 2 2 11 0 13M9 2.5c-2 2-2 11 0 13"/>',
      Favorite: '<path d="m9 2 2.1 4.3 4.7.7-3.4 3.3.8 4.7L9 12.8l-4.2 2.2.8-4.7L2.2 7l4.7-.7z"/>',
      Generale: '<rect x="2" y="3.5" width="14" height="10" rx="2"/><path d="M6 16h6M9 13.5V16"/>',
      Știri: '<path d="M3 3h10v12H3z"/><path d="M6 6h4M6 9h4M6 12h2M13 6h2v8"/>',
      Sport: '<circle cx="9" cy="9" r="6.5"/><path d="m7 3 2 3 3-.5M15 8l-3 2 1 4M4 13l3-2-1-3"/>',
      Filme: '<rect x="2.5" y="3" width="13" height="12" rx="1.5"/><path d="M6 3v12M12 3v12M2.5 7h3.5M12 7h3.5M2.5 11h3.5M12 11h3.5"/>',
      Copii: '<circle cx="9" cy="9" r="6.5"/><path d="M6 10s1 2 3 2 3-2 3-2M6.5 7h.1M11.5 7h.1"/>',
      Tematice: '<rect x="2.5" y="2.5" width="5" height="5" rx="1"/><rect x="10.5" y="2.5" width="5" height="5" rx="1"/><rect x="2.5" y="10.5" width="5" height="5" rx="1"/><rect x="10.5" y="10.5" width="5" height="5" rx="1"/>',
      Muzică: '<path d="M11 12V3l5-1v9M11 6l5-1M11 12a2 2 0 1 1-2-2h2M16 11a2 2 0 1 1-2-2h2"/>'
    };
    const icon = name => `<svg class="ui-icon" viewBox="0 0 18 18" aria-hidden="true">${categoryPaths[name] || categoryPaths.Toate}</svg>`;
    const actionLabel = (name, label) => `${icon(name)}<span>${label}</span>`;
    const grid = document.querySelector('#grid');
    const nav = document.querySelector('#categories');
    const favorites = new Set(JSON.parse(localStorage.getItem('razvantv.preview.favorites') || '[]'));
    let stations = [], category = 'Toate', favoritesOnly = false, selected = null;
    const esc = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    function render() {
      nav.innerHTML = categories.map(name => `<button class="${!favoritesOnly && category === name ? 'active' : ''}" data-category="${esc(name)}">${icon(name)}<span>${esc(name.toUpperCase())}</span></button>`).join('');
      const visible = stations.filter(item =>
        favoritesOnly ? favorites.has(item.url) : category === 'Toate' || item.categories.includes(category));
      document.querySelector('#count').textContent = `${visible.length} CANALE`;
      grid.innerHTML = visible.length ? visible.map(item =>
        `<button class="station" data-url="${esc(item.url)}" aria-label="${esc(item.name)}">
          <img src="${esc(item.logo)}" alt="" loading="lazy">
          <span class="station-title">${esc(item.name)}</span>
          ${favorites.has(item.url) ? '<span class="favorite-mark" aria-hidden="true">★</span>' : ''}
        </button>`).join('') : '<div class="empty">Niciun canal în această categorie.</div>';
      grid.querySelectorAll('[data-url]').forEach(button => {
        const item = visible.find(channel => channel.url === button.dataset.url);
        button.addEventListener('focus', () => { selected = item; updateSave(); });
        button.addEventListener('click', () => openStation(item));
        button.addEventListener('contextmenu', event => { event.preventDefault(); toggleFavorite(item); });
      });
      nav.querySelectorAll('[data-category]').forEach(button => button.addEventListener('click', () => {
        category = button.dataset.category; favoritesOnly = false; render(); grid.querySelector('button')?.focus();
      }));
      updateSave();
    }
    function updateSave() {
      const button = document.querySelector('#save-selected');
      button.innerHTML = actionLabel('Favorite', selected && favorites.has(selected.url) ? 'SALVAT' : 'SALVEAZĂ');
      button.disabled = !selected;
    }
    function toggleFavorite(item) {
      if (favorites.has(item.url)) favorites.delete(item.url); else favorites.add(item.url);
      localStorage.setItem('razvantv.preview.favorites', JSON.stringify([...favorites]));
      render();
    }
    function openStation(item) {
      selected = item;
      document.querySelector('#playing').textContent = item.name;
      const frame = document.querySelector('#frame');
      const favoriteButton = document.querySelector('#player-favorite');
      favoriteButton.innerHTML = actionLabel('Favorite', favorites.has(item.url) ? 'FAVORIT' : 'FAVORIT');
      frame.src = item.url;
      document.querySelector('#player').classList.add('open');
      frame.focus();
    }
    function closePlayer() {
      document.querySelector('#player').classList.remove('open');
      document.querySelector('#frame').src = 'about:blank';
      grid.querySelector(`[data-url="${CSS.escape(selected?.url || '')}"]`)?.focus() || grid.querySelector('button')?.focus();
    }
    document.querySelector('#favorite-filter').addEventListener('click', event => {
      favoritesOnly = !favoritesOnly; category = 'Toate';
      event.currentTarget.innerHTML = actionLabel(favoritesOnly ? 'Toate' : 'Favorite', favoritesOnly ? 'TOATE CANALELE' : 'FAVORITE');
      render(); grid.querySelector('button')?.focus();
    });
    document.querySelector('#save-selected').addEventListener('click', () => selected && toggleFavorite(selected));
    document.querySelector('#back').addEventListener('click', closePlayer);
    document.querySelector('#player-favorite').addEventListener('click', () => {
      if (selected) {
        toggleFavorite(selected);
        document.querySelector('#player-favorite').innerHTML = actionLabel('Favorite', 'FAVORIT');
      }
    });
    document.querySelector('#open-page').addEventListener('click', () => {
      if (selected) window.open(selected.url, '_blank', 'noopener');
    });
    document.querySelector('#favorite-filter').innerHTML = actionLabel('Favorite', 'FAVORITE');
    document.querySelector('#player-favorite').innerHTML = actionLabel('Favorite', 'FAVORIT');
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && document.querySelector('#player').classList.contains('open')) { closePlayer(); return; }
      if (event.key.toLowerCase() === 'f' && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
        event.preventDefault(); if (selected) toggleFavorite(selected);
      }
      if (event.key === 'Enter' && document.activeElement.classList.contains('station')) document.activeElement.click();
    });
    document.querySelector('#frame').addEventListener('load', () => {});
    fetch('./app/src/main/assets/channels.json')
      .then(response => { if (!response.ok) throw new Error(`HTTP ${response.status}`); return response.json(); })
      .then(data => { stations = data; render(); grid.querySelector('button')?.focus(); })
      .catch(error => { console.error(error); grid.innerHTML = '<div class="empty">Lista canalelor nu s-a putut încărca.</div>'; });
  </script>
</body>
</html>
